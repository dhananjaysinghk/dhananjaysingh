<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients for Razor-Sharp Geometric Tech Mark -->
    <linearGradient id="facet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="facet-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="facet-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="facet-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Modern Geometric Faceted Tech Prism Mark -->
  <g shape-rendering="geometricPrecision">
    <!-- Facet 1: Left Wing / Cyan Apex -->
    <polygon points="256,44 146,260 256,212 256,44" fill="url(#facet-cyan)" />
    
    <!-- Facet 2: Outer Left Sweep -->
    <polygon points="146,260 62,440 256,380 256,212" fill="url(#facet-indigo)" />
    
    <!-- Facet 3: Right Wing / Violet Apex -->
    <polygon points="256,44 256,212 366,260 256,44" fill="url(#facet-accent)" />
    
    <!-- Facet 4: Outer Right Sweep -->
    <polygon points="366,260 256,212 256,380 450,440" fill="url(#facet-violet)" />
    
    <!-- Facet 5: Bottom Base Prism Refraction -->
    <polygon points="256,380 62,440 256,468 450,440" fill="#2E1065" opacity="0.85" />
    <polygon points="256,380 180,448 256,468 332,448" fill="#4338CA" opacity="0.9" />
  </g>
</svg>